        </li>
        <li>
          <a href="gallery.html" class="relative text-white transition duration-200 ease-in-out after:absolute after:content-[''] after:-bottom-1.5 after:left-0 after:w-full after:h-[2px] after:bg-[#990000] after:origin-left after:scale-x-100">Galeria</a>
        </li>
        <li>

        <li>

  <main>
    <section class="py-14 md:py-20 px-4">
      <div class="max-w-6xl mx-auto text-center">
        <p class="text-zinc-500 uppercase tracking-[0.3em] text-sm">Nossos momentos</p>
        <h3 class="[font-family:'Anton_SC'] relative inline-block z-[1] text-5xl md:text-6xl text-white uppercase mt-3 after:absolute after:content-[''] after:bottom-0 after:left-0 after:-z-[1] after:h-3.5 after:w-full after:bg-[#990000]">Galeria</h3>

        <div id="galeria-grid" class="mt-14 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">

          <button type="button" class="group relative block aspect-square overflow-hidden rounded-md border border-zinc-800 shadow-2xl grayscale hover:grayscale-0 transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-[#990000]" data-full="./gallery/gallery-01.jpeg">
            <img src="./gallery/gallery-01.jpeg" alt="Foto 1 da galeria" loading="lazy" class="w-full h-full object-cover transition duration-300 ease-in-out group-hover:scale-105">
          </button>
          <button type="button" class="group relative block aspect-square overflow-hidden rounded-md border border-zinc-800 shadow-2xl grayscale hover:grayscale-0 transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-[#990000]" data-full="./gallery/gallery-02.jpeg">
            <img src="./gallery/gallery-02.jpeg" alt="Foto 2 da galeria" loading="lazy" class="w-full h-full object-cover transition duration-300 ease-in-out group-hover:scale-105">
          </button>
          <button type="button" class="group relative block aspect-square overflow-hidden rounded-md border border-zinc-800 shadow-2xl grayscale hover:grayscale-0 transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-[#990000]" data-full="./gallery/gallery-03.jpeg">
            <img src="./gallery/gallery-03.jpeg" alt="Foto 3 da galeria" loading="lazy" class="w-full h-full object-cover transition duration-300 ease-in-out group-hover:scale-105">
          </button>
          <button type="button" class="group relative block aspect-square overflow-hidden rounded-md border border-zinc-800 shadow-2xl grayscale hover:grayscale-0 transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-[#990000]" data-full="./gallery/gallery-04.jpeg">
            <img src="./gallery/gallery-04.jpeg" alt="Foto 4 da galeria" loading="lazy" class="w-full h-full object-cover transition duration-300 ease-in-out group-hover:scale-105">
          </button>
          <button type="button" class="group relative block aspect-square overflow-hidden rounded-md border border-zinc-800 shadow-2xl grayscale hover:grayscale-0 transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-[#990000]" data-full="./gallery/gallery-05.jpeg">
            <img src="./gallery/gallery-05.jpeg" alt="Foto 5 da galeria" loading="lazy" class="w-full h-full object-cover transition duration-300 ease-in-out group-hover:scale-105">
          </button>
          <button type="button" class="group relative block aspect-square overflow-hidden rounded-md border border-zinc-800 shadow-2xl grayscale hover:grayscale-0 transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-[#990000]" data-full="./gallery/gallery-06.jpeg">
            <img src="./gallery/gallery-06.jpeg" alt="Foto 6 da galeria" loading="lazy" class="w-full h-full object-cover transition duration-300 ease-in-out group-hover:scale-105">
          </button>
          <button type="button" class="group relative block aspect-square overflow-hidden rounded-md border border-zinc-800 shadow-2xl grayscale hover:grayscale-0 transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-[#990000]" data-full="./gallery/gallery-07.jpeg">
            <img src="./gallery/gallery-07.jpeg" alt="Foto 7 da galeria" loading="lazy" class="w-full h-full object-cover transition duration-300 ease-in-out group-hover:scale-105">
          </button>
          <button type="button" class="group relative block aspect-square overflow-hidden rounded-md border border-zinc-800 shadow-2xl grayscale hover:grayscale-0 transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-[#990000]" data-full="./gallery/gallery-08.jpeg">
            <img src="./gallery/gallery-08.jpeg" alt="Foto 8 da galeria" loading="lazy" class="w-full h-full object-cover transition duration-300 ease-in-out group-hover:scale-105">
          </button>
          <button type="button" class="group relative block aspect-square overflow-hidden rounded-md border border-zinc-800 shadow-2xl grayscale hover:grayscale-0 transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-[#990000]" data-full="./gallery/gallery-09.jpeg">
            <img src="./gallery/gallery-09.jpeg" alt="Foto 9 da galeria" loading="lazy" class="w-full h-full object-cover transition duration-300 ease-in-out group-hover:scale-105">
          </button>

        </div>
      </div>
    </section>

    <footer class="border-t border-zinc-800 py-8 px-4 text-center text-sm text-zinc-500">
      <p>Copyright &copy; Banda RPA - <span id="ano"></span></p>
    </footer>
  </main>

  <dialog id="lightbox" class="relative m-auto max-w-[92vw] max-h-[92vh] bg-black border border-zinc-700 rounded-md shadow-2xl p-0 backdrop:bg-black/80">
<button type="button" id="close-lightbox" aria-label="Fechar galeria" class="absolute -top-2 -right-2 z-10 w-10 h-10 rounded-full bg-transparent text-white hover:bg-white hover:text-zinc-900 border border-zinc-600 transition duration-200 ease-in-out flex items-center justify-center shadow-2xl">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-5">
    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
  </svg>
</button>
    <img id="lightbox-img" src="" alt="Foto ampliada" class="max-w-full max-h-[calc(92vh-1rem)] rounded-md object-contain">
  </dialog>

  <script>
    document.getElementById("ano").textContent = new Date().getFullYear();

    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const closeBtn = document.getElementById("close-lightbox");

    document.querySelectorAll("#galeria-grid button").forEach((btn) => {
      btn.addEventListener("click", () => {
        lightboxImg.src = btn.dataset.full;
        lightboxImg.alt = btn.querySelector("img").alt;
        lightbox.showModal();
      });
    });

    closeBtn.addEventListener("click", () => lightbox.close());

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) lightbox.close();
    });

    lightbox.addEventListener("close", () => {
      lightboxImg.src = "";
    });
  </script>
</body>
</html>
