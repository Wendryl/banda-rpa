backend:
  name: github
  repo: Wendryl/banda-rpa
  branch: master
  base_url: https://decap-cms-proxy.onrender.com
  auth_endpoint: auth
  auth_scope: repo

local_backend: true

locale: pt

media_folder: "src/gallery"
public_folder: "./gallery"

collections:
  - name: agenda
    label: "Shows"
    description: "Editar, adicionar e remover shows da agenda"
    format: json
    files:
      - name: shows
        label: "Shows"
        file: "src/_data/agenda.json"
        fields:
          - label: "Shows"
            name: shows
            widget: list
            collapsed: false
            hint: "Arraste para reordenar. Use o botão para adicionar ou remover."
            fields:
              - { label: "Data", name: date, widget: datetime, format: "YYYY-MM-DD" }
              - { label: "Cidade", name: city, widget: string }
              - { label: "Local / Venue", name: venue, widget: string, required: false }

  - name: gallery
    label: "Galeria"
    description: "Adicionar, excluir e reordenar fotos"
    format: json
    files:
      - name: photos
        label: "Fotos"
        file: "src/_data/gallery-manifest.json"
        fields:
          - label: "Fotos"
            name: photos
            widget: list
            collapsed: false
            add_to_top: true
            hint: "Novas fotos são adicionadas no topo e aparecem primeiro no site. A ordem aqui é a exibição no site. Remova um item para ocultar a foto. Envie novas fotos pelo botão de mídia."
            fields:
              - label: "Foto"
                name: file
                widget: image
                choose_url: false

  - name: videos
    label: "Vídeos"
    description: "Adicionar, excluir e reordenar vídeos da banda"
    format: json
    files:
      - name: videos
        label: "Vídeos"
        file: "src/_data/videos-manifest.json"
        fields:
          - label: "Vídeos"
            name: videos
            widget: list
            collapsed: true
            add_to_top: true
            hint: "Envie o arquivo de vídeo (MP4 recomendado). Arquivos grandes deixam o site mais pesado e o GitHub limita uploads a ~100 MB; prefira vídeos curtos/compactados."
            fields:
              - label: "Vídeo"
                name: file
                widget: file
                choose_url: false
                media_folder: "/src/videos"
                public_folder: "/videos"
                media_library:
                  allow_multiple: false
                  config:
                    max_file_size: 99614720
              - label: "Título"
                name: title
                widget: string
                required: false
              - label: "Pôster (opcional)"
                name: poster
                widget: image
                required: false
                choose_url: false
                media_folder: "/src/videos"
                public_folder: "/videos"